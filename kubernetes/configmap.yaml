apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: resume-screening
data:
  NODE_ENV: production
  PORT: "5000"
  FRONTEND_ORIGIN: "*"
  JWT_SECRET: change-this-production-secret
  JWT_EXPIRES_IN: 8h
  MAX_FILE_SIZE_MB: "5"
  CACHE_TTL_SECONDS: "60"
  AWS_REGION: us-east-1
  DYNAMODB_TABLE: candidates
  HR_TABLE: hr-users
  S3_BUCKET_NAME: srs-platform
