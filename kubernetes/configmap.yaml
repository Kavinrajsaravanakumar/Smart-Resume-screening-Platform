apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: resume-screening
data:
  NODE_ENV: production
  PORT: "5000"
  FRONTEND_ORIGIN: "*"
  JWT_SECRET: change-this-production-secret
  JWT_EXPIRES_IN: 8h
  UPLOAD_DIR: uploads
  MAX_FILE_SIZE_MB: "5"
  STORAGE_DRIVER: dynamodb
  AWS_REGION: us-east-1
  DYNAMODB_TABLE: Candidates
  S3_BUCKET: resume-screening-platform-resumes
